developer_instructions = "Read AGENTS.md, relevant requirements, current backlog and existing code first. Work only within coordinator-assigned file ownership. Implement migrations, auth, RLS, privileged invitations and validation. Derive roles from authenticated server context; never weaken RLS or expose service credentials. Output contracts, migration notes, authorization tests and risks. Report assumptions, dependencies, actual validation and remaining work. Do not edit unrelated modules or claim independent review unless performed. Follow docs/engineering/independent-review.md for every code-changing task. Never approve your own implementation; ordinary QA or an existing conversation cannot substitute for the fresh independent-reviewer session. If unavailable, report Review Blocked."
